<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>time · 今日行程</title>
<style>
  :root{
    --bg:#f7f6f3; --card:#fff; --ink:#1c1b19; --muted:#6f6b64;
    --line:#e3e0da; --accent:#2f6f4e; --accent-soft:#e8f0eb;
    --warn:#9c5220; --warn-soft:#f7ede4;
  }
  *{box-sizing:border-box}
  body{
    margin:0; padding:32px 20px 64px; background:var(--bg); color:var(--ink);
    font:15px/1.6 -apple-system,"Segoe UI","Microsoft YaHei",sans-serif;
  }
  .wrap{max-width:660px;margin:0 auto}

  header{margin-bottom:22px}
  h1{margin:0;font-size:22px;font-weight:600;letter-spacing:.02em}
  .sub{color:var(--muted);font-size:13px;margin-top:3px}

  /*
    实时时钟。
    font-variant-numeric:tabular-nums 是关键，不是装饰：
    默认的比例字体里 "1" 比 "8" 窄，秒数一跳整行数字就往左右抖一下。
    等宽数字让每一位宽度固定，秒针跳的时候只有数字变，位置不动。
  */
  .clock{
    font-size:38px; font-weight:600; line-height:1.15; margin-top:10px;
    font-variant-numeric:tabular-nums; font-feature-settings:"tnum";
    color:var(--accent);
  }
  .clock .sec{font-size:22px; color:var(--muted); margin-left:2px}

  /* 图片入口长得像个次要按钮。做成 label 而不是 button，
     是因为它要触发的是一个隐藏的 file input，label 的 for 天然就能做到。 */
  .filebtn{
    display:inline-block; margin-top:10px; padding:8px 16px;
    border:1px solid var(--line); border-radius:8px;
    background:var(--bg); color:var(--muted);
    font-size:13px; cursor:pointer; user-select:none;
  }
  .filebtn:active{background:var(--accent-soft); color:var(--accent)}

  .card{
    background:var(--card); border:1px solid var(--line);
    border-radius:10px; padding:18px; margin-bottom:14px;
  }
  h2{
    font-size:12px; font-weight:600; color:var(--muted);
    letter-spacing:.09em; margin:0 0 12px;
  }

  /*
    【为什么每一条 1fr 都写成 minmax(0,1fr)】

    1fr 的全称是 minmax(auto, 1fr)，而那个 auto 的**最小值是 min-content**。
    表单控件有天然的最小宽度——一个 <input> 不给 size 时，浏览器按"大约 20 个
    字符宽"给它定尺寸。所以 `1fr 1fr` 的两列**压不到那个宽度以下**。

    手机上卡片内宽只有 296px 左右，两列的最小值加起来就超了，于是整页横向
    溢出：右边的输入框、按钮、甚至卡片的边框全跑到屏幕外面去。

    minmax(0,1fr) 把最小值显式设成 0，列就真的能压。再配合下面控件的
    min-width:0（网格项默认 min-width:auto，同样压不动），才彻底不溢出。

    这是个很容易踩的坑：**它不报错，也不变形，只是悄悄把页面撑宽，
    然后在手机上被裁掉一截。**
  */
  form{display:grid;gap:8px}
  #ai-form{grid-template-columns:minmax(0,1fr) auto}
  /* 事件 | 开始时间 | 持续时间 | 优先级 | 按钮 */
  #add-form{grid-template-columns:minmax(0,1fr) 104px 78px 74px auto}

  input,select,button{
    font:inherit; padding:9px 11px; border:1px solid var(--line);
    border-radius:7px; background:#fff; color:var(--ink);
    /* 网格项的 min-width 默认是 auto，同样会挡住收缩。见上面那段说明。 */
    min-width:0;
  }
  input:focus,select:focus{
    outline:2px solid var(--accent); outline-offset:-1px; border-color:transparent;
  }
  button{
    background:var(--accent); color:#fff; border-color:var(--accent);
    cursor:pointer; font-weight:500; white-space:nowrap;
  }
  button:hover{filter:brightness(1.08)}
  button:disabled{opacity:.45;cursor:default;filter:none}
  button.ghost{background:none;color:var(--muted);border-color:var(--line)}
  button.ghost:hover{filter:none;border-color:var(--muted);color:var(--ink)}

  /* 日期导航条：‹ 今天 2026-11-01 ›
     三栏网格 auto/1fr/auto，中间那栏吃掉剩余宽度。
     这样左右两个箭头永远贴在两端，标签在正中——
     标签文字长短变化（"今天" vs "11月3日 周二"）都不会把箭头挤歪。 */
  .daynav{
    display:grid; grid-template-columns:auto 1fr auto; align-items:center;
    gap:10px; margin-bottom:14px; padding-bottom:12px;
    border-bottom:1px solid var(--line);
  }
  .daymid{display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap}
  #day-label{font-weight:600}
  .daydate{color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums}
  .nav-btn{padding:3px 13px;font-size:17px;line-height:1.25}
  .mini{padding:2px 9px;font-size:12px;border-radius:5px}

  ul{list-style:none;margin:0;padding:0}
  li{
    display:flex; align-items:baseline; gap:11px;
    padding:11px 0; border-bottom:1px solid var(--line);
  }
  li:last-child{border-bottom:none}
  .time{
    font-variant-numeric:tabular-nums; color:var(--muted);
    font-size:13px; flex:0 0 104px;
  }
  /* ● = 这个时间是你自己定的，不是程序排的 */
  .fixed-mark{color:var(--accent);font-weight:700;margin-right:3px}
  .name{flex:1;min-width:0;overflow-wrap:anywhere}
  .meta{font-size:12px;color:var(--muted);flex:0 0 auto}
  .tag{
    font-size:11px;padding:2px 7px;border-radius:4px;flex:0 0 auto;
    background:#f0eee9;color:var(--muted);font-weight:500;
  }
  .tag.hi{background:var(--accent-soft);color:var(--accent)}

  .done-btn{
    background:none;border:1px solid var(--line);color:var(--muted);
    padding:2px 9px;font-size:12px;border-radius:5px;flex:0 0 auto;
  }
  .done-btn:hover{border-color:var(--accent);color:var(--accent);filter:none}

  .empty{color:var(--muted);font-size:14px;padding:6px 0}
  .unsched li{color:var(--warn);flex-wrap:wrap}
  .unsched .time{color:var(--warn)}
  /* 为什么没排上——不写原因的话用户只看到东西凭空消失 */
  .why{flex:1 0 100%;font-size:12px;color:var(--warn);opacity:.85;padding-left:104px}

  .summary{
    display:flex;gap:18px;font-size:13px;color:var(--muted);
    padding-top:12px;margin-top:2px;border-top:1px solid var(--line);
  }
  .summary b{color:var(--ink);font-weight:600}

  .error{
    background:var(--warn-soft);color:var(--warn);border:1px solid #e8d5c4;
    border-radius:7px;padding:9px 12px;font-size:13px;margin-top:10px;
  }
  .error:empty{display:none}

  /* AI 草稿区 */
  #drafts:not(:empty){margin-top:14px;border-top:1px solid var(--line);padding-top:12px}
  .draft-head{font-size:13px;color:var(--muted);margin-bottom:6px}
  .draft-head b{color:var(--ink)}
  .draft-list li{padding:8px 0}
  .draft-actions{display:flex;gap:8px;margin-top:12px}
  .draft-actions button{flex:0 0 auto;padding:8px 14px}

  @media(max-width:560px){
    body{padding:20px 14px 48px}

    /* 坑一：iOS Safari 在聚焦 font-size 小于 16px 的输入框时，
       会把整个页面自动放大，而且放大后不会自己缩回去。
       把控件字号钉死在 16px 就不会触发。**跟布局无关，纯粹是字号。** */
    /* 内边距可以收，字号不能动——每一行能矮 6px 左右，几行下来省出不少高度。 */
    input,select,button{font-size:16px; padding:7px 9px}

    /* 手动添加压成**两行**：
         [ 要做什么                        ]
         [ 15:00 ][ 60 ][ 中▾ ][ 添加 ]
       原来排的是三行（时间|分钟 一行、优先级|按钮 一行），手机上白白多占一行。
       四列能用 minmax(0,...) 挤下，靠的就是上面那条规则里的收缩能力。
       第一列给 1.25fr：时间输入框自带一个时钟图标，比另外两个宽一点才不挤。 */
    #add-form{
      grid-template-columns:minmax(0,1.25fr) minmax(0,1fr) minmax(0,1fr) auto;
      gap:6px;
    }
    #add-form input[name="name"]{grid-column:1/-1}

    /* 坑二：一行放不下"时间 + 名字 + 优先级 + 时长 + 按钮"五样东西。
       硬挤的结果是名字被压成一列一个字，等于看不见。
       改成两行：
           ● 09:00–10:30  写周报
           60分  高              [完成]
       grid-template-areas 是给每样东西指定"摆在哪一格"。
       比用 flex 硬挤好控制——想让谁换行就让谁换行。 */
    li{
      display:grid; align-items:baseline;
      grid-template-columns:auto 1fr auto;
      grid-template-areas:
        "time name name"
        "meta tag  btn"
        "why  why  why";
      column-gap:8px; row-gap:5px;
    }
    .time{grid-area:time; font-size:12px}
    .name{grid-area:name}
    .meta{grid-area:meta; font-size:11px}
    .tag{grid-area:tag; justify-self:start}
    .done-btn{grid-area:btn; justify-self:end; padding:8px 14px; font-size:13px}
    .why{grid-area:why; padding-left:0}

    /* 坑三：手指比鼠标粗得多。按钮太小会点不准，
       而且点到旁边就是"没反应"，用户只会觉得程序坏了。 */
    .summary{flex-wrap:wrap; gap:6px 16px}
    .draft-actions{flex-wrap:wrap}
    .draft-actions button{padding:11px 16px}
  }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <h1>time</h1>
    <!--
      时钟分两个 span：时分用大号字、秒用小一号的灰字。
      一眼扫过去先看到"现在几点几分"，秒是补充信息，不用抢主次。
    -->
    <div class="clock" id="clock">
      <span id="clock-hm">--:--</span><span class="sec" id="clock-sec">:--</span>
    </div>
    <div class="sub" id="sub">加载中…</div>
  </header>

  <div class="card">
    <h2>说人话</h2>
    <form id="ai-form">
      <!-- 去掉了 required：只发图不打字时，浏览器那句"请填写此字段"
           不如服务端那句"说点什么，或者发张图"清楚 -->
      <input name="text" placeholder="比如：明天上午把周报写完，大概一小时，很急"
             autocomplete="off">
      <button type="submit">解析</button>
    </form>
    <!--
      图片入口。accept="image/*" 在手机上会同时给出"拍照"和"从相册选"两个选项。
      真正的 input 藏起来，用 label 当按钮——原生的 file 控件各家长得都不一样，
      没法跟这套样式统一。
    -->
    <label class="filebtn" for="ai-image">拍张照 / 选张图</label>
    <input type="file" id="ai-image" accept="image/*" hidden>
    <div class="error" id="ai-error"></div>
    <div id="drafts"></div>
  </div>

  <div class="card">
    <h2>手动添加 <span class="daydate" id="add-day"></span></h2>
    <form id="add-form">
      <input name="name" placeholder="要做什么" autocomplete="off" required>
      <!-- type="time" 空着时值是空字符串，正好等于"没定时间，自动找空档" -->
      <input name="start" type="time" title="开始时间。留空就自动找空档">
      <input name="minutes" type="number" min="1" placeholder="分钟"
             title="持续多久（分钟）" required>
      <select name="priority" title="优先级">
        <option value="高">高</option>
        <option value="中" selected>中</option>
        <option value="低">低</option>
      </select>
      <button type="submit">添加</button>
    </form>
    <div class="error" id="error"></div>
  </div>

  <div class="card">
    <h2 id="day-title">行程</h2>
    <div class="daynav">
      <button type="button" class="ghost nav-btn" id="prev-day" title="前一天">‹</button>
      <div class="daymid">
        <span id="day-label">…</span>
        <span class="daydate" id="day-date"></span>
        <button type="button" class="ghost mini" id="back-today" hidden>回到今天</button>
      </div>
      <button type="button" class="ghost nav-btn" id="next-day" title="后一天">›</button>
    </div>
    <ul id="schedule"></ul>
    <div class="summary" id="summary"></div>
  </div>

  <div class="card" id="unsched-card" hidden>
    <h2>待办栏</h2>
    <ul class="unsched" id="unsched"></ul>
  </div>

</div>

<script>
const $ = (id) => document.getElementById(id);

// 优先级 -> CSS 类名。用映射而不是直接拼字符串，
// 免得数据里的怪字符跑到 class 属性里去。
const PCLASS = { "高": "hi", "中": "mid", "低": "lo" };

// 用户输入的名字会显示到页面上，必须转义，
// 否则名字里写 <script> 就会被当成代码执行（XSS）
function esc(s) {
  return String(s).replace(/[&<>"]/g, c => (
    { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]
  ));
}

// timeHtml 是"已经拼好的 HTML"，直接插进去不转义——它只能由后端给的
// 时间文本和下面这个 ● 标记拼出来，不含用户输入。名字走 esc()。
function row(t, timeHtml, extra, why) {
  return `<li>
    <span class="time">${timeHtml}</span>
    <span class="name">${esc(t.name)}</span>
    <span class="tag ${PCLASS[t.priority] || "mid"}">${esc(t.priority)}</span>
    <span class="meta">${t.minutes}分${extra || ""}</span>
    ${why ? `<span class="why">${esc(why)}</span>` : ""}
  </li>`;
}

/* ---------- 行程 ---------- */

// 现在看的是哪一天。**日期一律由服务端给，前端从不自己算。**
// 为什么？因为跨月、跨年、闰年、时区，这些地方自己算迟早会错；
// 而 Python 那边已经有一套测过的 shift_day 了，直接用它的结果最省心。
// null 表示"还没问过服务端"，第一次请求就不带参数，让服务端给今天。
/* ---------- 实时时钟 ---------- */

// 为什么不用 setInterval(tick, 1000)：
// setInterval 只保证"至少隔 1000 毫秒调一次"，每次回调自己执行花掉的时间
// 会累加进去。跑十几分钟，显示的秒数就会比真实时间慢一两秒，
// 而且偶尔会跳秒、或者同一秒显示两遍。
//
// 正确做法是每一跳都**重新对齐到下一个整秒**：看当前这一秒已经过去多少毫秒，
// 就只等剩下的那点。误差不会被累积，某一跳晚了下一跳自己会纠回来。
let clockTimer = null;

function tickClock() {
  const now = new Date();
  const pad = (n) => String(n).padStart(2, "0");

  $("clock-hm").textContent = pad(now.getHours()) + ":" + pad(now.getMinutes());
  $("clock-sec").textContent = ":" + pad(now.getSeconds());

  clockTimer = setTimeout(tickClock, 1000 - now.getMilliseconds());
}

function startClock() {
  if (clockTimer !== null) return;   // 已经在跑了，别起第二个
  tickClock();
}

function stopClock() {
  clearTimeout(clockTimer);
  clockTimer = null;
}

startClock();

// 页面切到后台（锁屏、切到别的 App）时把秒针停掉。
// 手机上这条很实在：屏幕都黑了，计时器还在后台每秒醒一次，纯属白耗电。
// 切回来时再启动，tickClock 会立刻把时间刷成当前值，不会停在旧时间上。
document.addEventListener("visibilitychange", () => {
  if (document.hidden) stopClock();
  else startClock();
});

let viewDay = null;

async function refresh(day) {
  if (day !== undefined) viewDay = day;

  const url = viewDay ? `/api/plan?date=${encodeURIComponent(viewDay)}` : "/api/plan";
  const res = await fetch(url);
  const data = await res.json();
  if (!res.ok) {
    $("ai-error").textContent = data.error || "读不到行程";
    return;
  }

  // 以服务端返回的为准，覆盖本地那份——两边不一致时听服务端的
  viewDay = data.day;
  const isToday = data.day === data.today;

  $("sub").textContent = `自动排程区间 ${data.day_start}–${data.day_end}`;
  $("day-title").textContent = `${data.label}的行程`;
  $("day-label").textContent = data.label;
  $("day-date").textContent = isToday ? "" : data.day;
  $("back-today").hidden = isToday;
  // 手动添加加的是"你正在看的这一天"。写在标题上，免得翻到后天加东西时
  // 心里没底——加错了要翻回去才发现。
  $("add-day").textContent = isToday ? "" : `→ ${data.day}`;

  $("schedule").innerHTML = data.scheduled.length
    ? data.scheduled.map(t => row(
        t,
        // ● 表示这个时间是你自己定的；没有 ● 的是程序找的空档
        (t.auto ? "" : `<span class="fixed-mark">●</span>`) + `${t.start}–${t.end}`,
        `<button class="done-btn" data-done="${t.id}">完成</button>`
      )).join("")
    : `<div class="empty">还没有安排。上面加一条试试。</div>`;

  const used = data.scheduled.reduce((sum, t) => sum + t.minutes, 0);
  $("summary").innerHTML = `
    <span>已排 <b>${data.scheduled.length}</b> 件</span>
    <span>占用 <b>${used}</b> 分钟</span>
    <span>待办 <b>${data.blocked.length}</b> 件</span>`;

  const card = $("unsched-card");
  card.hidden = !data.blocked.length;
  if (data.blocked.length) {
    // 每条都写清楚为什么没排上：被谁挤掉，还是根本没这么大空档。
    // 定了时间却没排上的也标 ●——那本来是你钉的时间，被顶掉了要看得出来。
    $("unsched").innerHTML = data.blocked
      .map(t => row(
        t,
        t.start ? `<span class="fixed-mark">●</span>${t.start}` : "待办",
        "",
        t.reason
      )).join("");
  }

  // 箭头指向哪儿也听服务端的（data.prev / data.next）。
  // 存下来而不是现算，是为了跟上面显示的那一天严格对得上。
  $("prev-day").dataset.day = data.prev;
  $("next-day").dataset.day = data.next;
}

$("prev-day").addEventListener("click", (e) => refresh(e.target.dataset.day));
$("next-day").addEventListener("click", (e) => refresh(e.target.dataset.day));
$("back-today").addEventListener("click", () => refresh(null));

/* ---------- AI 解析 ---------- */

// AI 给出的草稿。**确认之前它只是个数组，没有任何东西被存下来。**
let drafts = [];

function renderDrafts() {
  const box = $("drafts");
  if (!drafts.length) { box.innerHTML = ""; return; }

  box.innerHTML = `
    <div class="draft-head">
      AI 解析出 ${drafts.length} 条，<b>确认后才会存进去</b>：
    </div>
    <ul class="draft-list">
      ${drafts.map((t, i) => `
        <li>
          <span class="name">${esc(t.name)}</span>
          <span class="tag ${PCLASS[t.priority] || "mid"}">${esc(t.priority)}</span>
          <span class="meta">${t.minutes}分${
            t.guessed ? " · AI 估的" : ""
          }${t.start ? " · " + esc(t.start) + " 开始" : " · 自动安排"}${
            // AI 说了日期就标出来。**这一步是给人看的最后一道关**：
            // 它说"下周三"到底是哪天，你在这里一眼能确认，确认了才入库。
            t.date_label ? ` · <b>${esc(t.date_label)}</b>` : ""
          }</span>
          <button class="done-btn" data-drop="${i}">不要</button>
        </li>`).join("")}
    </ul>
    <div class="draft-actions">
      <button id="confirm-drafts">确认添加 ${drafts.length} 条</button>
      <button class="ghost" id="cancel-drafts">全部取消</button>
    </div>`;
}

async function confirmDrafts(btn) {
  btn.disabled = true;
  btn.textContent = "添加中…";
  const failures = [];

  // 逐条走 /api/tasks —— 也就是**再校验一遍**。
  // 草稿在 parse_reply 里已经验过一次，这里是第二道。
  // 两道都留着，因为"验证"这件事的成本远低于"脏数据进了库"。
  //
  // 落到哪天：**AI 说了就听 AI 的，没说才用你正在看的那天。**
  // 你说"明天写周报"时正在看今天，那它就该去明天。
  const landed = new Set();
  for (const t of drafts) {
    const day = t.date || viewDay;
    const res = await fetch("/api/tasks", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        name: t.name,
        minutes: t.minutes,
        priority: t.priority,
        start: t.start || "",     // 空 = 没定时间，交给程序找空档
        date: day,
      }),
    });
    if (res.ok) {
      landed.add(day);
    } else {
      const data = await res.json().catch(() => ({}));
      failures.push(`${t.name}：${data.error || "HTTP " + res.status}`);
    }
  }

  drafts = [];
  renderDrafts();
  $("ai-form").reset();
  $("ai-error").textContent = failures.length ? "部分没加上——" + failures.join("；") : "";

  // 都落到同一天、而且不是你现在看的这天 —— 就跟过去。
  // 不然你说"明天写周报"，加完屏幕上什么都没变，会以为没加上。
  const only = landed.size === 1 ? [...landed][0] : null;
  refresh(only && only !== viewDay ? only : undefined);
}

/* ---------- 图片 → 缩小 → base64 ---------- */

// 把手机拍的照片缩小再传。
//
// 为什么不直接传原图：手机随手一拍就是 3~12MB，base64 之后还要再涨三分之一，
// 一个请求体十几兆。而模型看 1600px 宽和看 4000px 宽，认字能力没有区别。
//
// 顺带解决了**照片方向**问题：手机照片常常靠 EXIF 里的一个字段标记
// "该转 90 度"，像素本身是躺着的。现代浏览器显示 <img> 时会自动应用这个旋转，
// 所以 drawImage 画到画布上拿到的已经是摆正的图——不用自己解析 EXIF。
function loadImageFile(file) {
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => { URL.revokeObjectURL(url); resolve(img); };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error("这张图打不开")); };
    img.src = url;
  });
}

const MAX_IMAGE_SIDE = 1600;

async function shrinkToBase64(file) {
  const img = await loadImageFile(file);
  const scale = Math.min(1, MAX_IMAGE_SIDE / Math.max(img.width, img.height));
  const w = Math.max(1, Math.round(img.width * scale));
  const h = Math.max(1, Math.round(img.height * scale));

  const canvas = document.createElement("canvas");
  canvas.width = w;
  canvas.height = h;
  const ctx = canvas.getContext("2d");
  // 先铺白底再画。PNG 的透明区域转成 JPEG 会变成**黑色**，
  // 而截图里那些"透明"的地方你以为是白的——一张黑底黑字的图就什么都认不出来了。
  ctx.fillStyle = "#fff";
  ctx.fillRect(0, 0, w, h);
  ctx.drawImage(img, 0, 0, w, h);

  // toDataURL 返回的是 "data:image/jpeg;base64,XXXX"，
  // 服务端只要逗号后面那一段（带前缀传过去 base64 解不开）
  return canvas.toDataURL("image/jpeg", 0.85).split(",", 2)[1];
}

/* ---------- 解析（文字和图片共用） ---------- */

async function runParse(body, imageFile) {
  const btn = $("ai-form").querySelector("button");
  const oldLabel = btn.textContent;
  btn.disabled = true;
  btn.textContent = imageFile ? "看图…" : "解析中…";
  $("ai-error").textContent = "";
  drafts = [];
  renderDrafts();

  try {
    if (imageFile) {
      body.image = await shrinkToBase64(imageFile);
      body.media_type = "image/jpeg";
    }
    const res = await fetch("/api/parse", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body),
    });
    const data = await res.json();

    if (!res.ok) {
      $("ai-error").textContent = data.error || "解析失败";
      return;
    }
    if (!data.drafts.length) {
      $("ai-error").textContent = imageFile
        ? "图里没看出什么可做的事务。试试拍清楚一点、或者只截日程那一块"
        : "没听出什么可做的事务，换个说法试试";
      return;
    }
    drafts = data.drafts;
    renderDrafts();
    // warning 是"有几条没解析出来"，不是失败——好的那几条照样能确认
    $("ai-error").textContent = data.warning || "";
  } catch (err) {
    $("ai-error").textContent = "请求没发出去：" + err;
  } finally {
    btn.disabled = false;
    btn.textContent = oldLabel;
  }
}

$("ai-form").addEventListener("submit", (e) => {
  e.preventDefault();
  runParse({ text: e.target.elements.namedItem("text").value });
});

$("ai-image").addEventListener("change", (e) => {
  const file = e.target.files && e.target.files[0];
  e.target.value = "";   // 清掉，这样同一张图连选两次也能再次触发
  if (!file) return;
  // 输入框里有字的话一起带上——"发张课表 + 只排下周的"
  runParse({ text: $("ai-form").elements.namedItem("text").value }, file);
});

$("drafts").addEventListener("click", (e) => {
  const drop = e.target.dataset.drop;
  if (drop !== undefined) {
    drafts.splice(Number(drop), 1);
    renderDrafts();
    return;
  }
  if (e.target.id === "cancel-drafts") {
    drafts = [];
    renderDrafts();
    $("ai-form").reset();
    return;
  }
  if (e.target.id === "confirm-drafts") {
    confirmDrafts(e.target);
  }
});

/* ---------- 手动添加 ---------- */

$("add-form").addEventListener("submit", async (e) => {
  e.preventDefault();
  const form = e.target;
  const btn = form.querySelector("button");
  btn.disabled = true;
  $("error").textContent = "";

  const res = await fetch("/api/tasks", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      name: form.elements.namedItem("name").value,
      start: form.elements.namedItem("start").value,   // type=time 空着就是 ""
      minutes: form.elements.namedItem("minutes").value,
      priority: form.elements.namedItem("priority").value,
      // **明确告诉服务端加到哪天**，不让它自己"猜今天"——
      // 你可能正翻到后天在往里加事，那时候"今天"不是你想要的答案。
      date: viewDay,
    }),
  });
  const data = await res.json();
  btn.disabled = false;

  if (!res.ok) {
    // 后端返回的错误信息直接显示——它就是中文的
    $("error").textContent = data.error || "添加失败";
    return;
  }

  form.reset();
  form.elements.namedItem("name").focus();
  refresh();
});

$("schedule").addEventListener("click", async (e) => {
  const id = e.target.dataset.done;
  if (!id) return;
  await fetch(`/api/tasks/${id}/done`, { method: "POST" });
  refresh();
});

refresh();
</script>
</body>
